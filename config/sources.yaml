# Authoritative sources (methodology 3.0) - used to grade the agent's evidence.
# A domain matches if the source URL's host equals it or ends with "." + it.
# An agent value CHANGE backed only by sources outside this list is flagged for a
# glance, and every agent read gets an evidence grade (A/B/C) on the review panel.
# Add trackers or publications you trust; this list is a judgment, not a rule of nature.

