name: daily-risk-tracker

# Two cadences from ONE cron:
#   * every weekday  -> refresh live market data + narrative (free; reuses last agent ratings)
#   * every Monday   -> the SAME run ALSO runs the AI rating agent (day-of-week is checked
#     inside the run). SINGLE cron on purpose: the old two-cron design (weekdays + Mondays
#     at the same minute) fired twice on Mondays and the concurrency guard cancelled one at
#     random - making the Monday agent pass a coin flip.
#   * CATCH-UP: GitHub sometimes drops a scheduled run outright (Mon 2026-10-05 never ran,
#     so that week had no agent pass). Any scheduled run now ALSO runs the agent when the
#     last agent pass is 7+ days old - a missed Monday is made up the next weekday, and
#     the weekly API cost stays the same (one agent pass per week).
# Track record grading is AUTOMATIC on agent runs (src/grader.py, rubric in
# config/grading.yaml): two independent agents must agree or it waits for you.
# Your own grade always wins: add a row to grades.csv, or use the Run workflow form
# (grade_episode / grade / grade_note). Never hand-edit data/resolution_ledger.json.
# Manual runs from the Actions tab are FREE by default (data refresh + redeploy only);
# tick the "run_agent" box to also run the AI agent (uses API credits).
on:
  schedule:
    - cron: "37 11 * * 1-5"   # 11:37 UTC weekdays (pre-US-open). Off-peak minute on
                              # purpose: GitHub delays top-of-hour crons by 60-90+ min under load.
  workflow_dispatch:
    inputs:
      run_agent:
        description: "Run the AI rating agent (uses API credits). Leave unchecked to only refresh data + redeploy the site - no agent, no API cost."
        type: boolean
        default: false
      grade_episode:
        description: "OPTIONAL - grade a closed Track record episode: paste its ID from the dashboard (e.g. s6_rare_earths-2026-06-30). Leave blank otherwise."
        type: string
        default: ""
      grade:
        description: "Grade for that episode"
        type: choice
        options: ["(none)", "materialized", "contained", "faded"]
        default: "(none)"
      grade_note:
        description: "One-line reason for the grade (shown publicly next to it)"
        type: string
        default: ""

# Only one run at a time. A new run WAITS for the current one instead of cancelling it,
# so a manual run (e.g. grading) can never kill a scheduled run mid-way - with GitHub's
# multi-hour schedule delays you can't predict when that one is executing.
# (A stuck run is still capped by timeout-minutes below.)
concurrency:
  group: tracker
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Decide whether to run the agent
        id: mode
        run: |
          DOW=$(date -u +%u)   # 1 = Monday
          # Days since the last agent pass (99 if it can't be read -> treated as overdue).
          AGE=$(python3 -c "import json,datetime as d; g=json.load(open('data/agent_assessments.json')).get('generated',''); print((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(g)).days if g else 99)" 2>/dev/null || echo 99)
          echo "Last agent pass: $AGE day(s) ago"
          if [ "${{ github.event.inputs.run_agent }}" = "true" ] || { [ "${{ github.event_name }}" = "schedule" ] && { [ "$DOW" = "1" ] || [ "$AGE" -ge 7 ]; }; }; then
            echo "flag=--agent" >> "$GITHUB_OUTPUT"
            echo "Agent: ON for this run (you ticked run_agent, it's a Monday scheduled run, or the last pass is $AGE days old - catch-up)"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "Agent: OFF - market refresh + redeploy only, no API cost"
          fi

      - name: Config self-test (guard)
        run: python tests/selftest.py

      - name: Grade a Track record episode (only if filled in on the Run workflow form)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.grade_episode != ''
        continue-on-error: true   # a typo in the ID must never block the daily update
        env:
          EP: ${{ github.event.inputs.grade_episode }}
          GR: ${{ github.event.inputs.grade }}
          NOTE: ${{ github.event.inputs.grade_note }}
        run: |
          EP=$(echo "$EP" | xargs)
          if [ "$GR" = "(none)" ]; then
            echo "::error title=Grade not set::You entered an episode ID but left 'grade' at (none). Pick materialized, contained or faded."
            exit 1
          fi
          python src/ledger.py --grade "$EP" "$GR" --note "$NOTE" \
            || { echo "::error title=Grading failed::Check the ID (copy it from the dashboard's Track record) - open episodes cannot be graded."; exit 1; }
          echo "::notice title=Graded::$EP -> $GR"

      - name: Run tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # optional: free key from fred.stlouisfed.org makes FRED feeds reliable from CI
          AGENT_MODEL: ${{ vars.AGENT_MODEL || 'claude-sonnet-4-6' }}
          AGENT_CONCURRENCY: ${{ vars.AGENT_CONCURRENCY || '4' }}
          AGENT_MODEL_2: ${{ vars.AGENT_MODEL_2 || secrets.AGENT_MODEL_2 }}   # 'asi1' for independent cross-check; works as a variable OR a secret
          ASI1_API_KEY: ${{ secrets.ASI1_API_KEY }}           # required only if AGENT_MODEL_2 starts with 'asi1'
          SCOUT_MODEL: ${{ vars.SCOUT_MODEL || 'claude-sonnet-4-6' }}
          GRADER_MODEL: ${{ vars.GRADER_MODEL || vars.AGENT_MODEL || 'claude-sonnet-4-6' }}   # Track record auto-grader (runs with the weekly agent)
          # Optional alert channels (set as repo secrets; any/all/none):
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_MIN_LEVEL: ${{ vars.ALERT_MIN_LEVEL || '0' }}
        run: |
          if [ "${{ steps.mode.outputs.flag }}" = "--agent" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret is not set - the agent cannot research events; levels will stay at last ratings."
          fi
          python src/main.py ${{ steps.mode.outputs.flag }} --scout \
            || { echo "::warning::Primary run failed; falling back to offline (baseline) mode."; python src/main.py --offline --no-ai --no-alert; }

      - name: Commit updated data
        run: |
          git config user.name  "risk-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ dashboard/ output/ || true
          if git diff --cached --quiet; then
            echo "No file changes this run."
          else
            git commit -m "update $(date -u +%F)"
            # The remote may have moved while this run executed (e.g. files uploaded
            # via the web UI mid-run). Rebase our data commit on top and retry -
            # on conflict our freshly generated files win (-X theirs during rebase).
            ok=""
            for i in 1 2 3; do
              if git push; then ok=1; break; fi
              echo "push rejected (remote moved) - rebasing onto latest main and retrying ($i/3)"
              git pull --rebase -X theirs origin main || { git rebase --abort || true; git pull --rebase -X ours origin main || true; }
            done
            if [ -n "$ok" ]; then
              echo "Pushed updated data to the repo."
            else
              echo "::error::git push failed after 3 rebase retries. If this is the FIRST failure ever, check Settings > Actions > Workflow permissions (needs Read and write); otherwise the branch is moving faster than the bot - just run the workflow again."
            fi
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dashboard
          # unique per run AND attempt: re-running a failed run would otherwise leave
          # two artifacts named "github-pages" and deploy-pages refuses duplicates
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to Pages
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait before deploy retry
        if: steps.deploy1.outcome == 'failure'
        run: |
          echo "First deploy attempt failed - usually a transient Pages 'try again later' (rate limit)."
          echo "Waiting 90s and retrying once. NOTE: data was already committed; only the site publish is retrying."
          sleep 90

      - name: Deploy to Pages (retry)
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
